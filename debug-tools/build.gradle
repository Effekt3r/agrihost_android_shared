plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

group = 'za.co.mjrsolutions.shared'
version = '1.0.0'

// DEBUG-ONLY tooling. Consume with `debugImplementation`, never `implementation`: the
// launcher shortcut wipes the local database, and an unsynced assessment cannot be
// recovered once it is gone, so this must never exist in a release APK.
android {
    namespace 'za.co.mjrsolutions.shared.debug_tools'
    compileSdk 36
    defaultConfig {
        minSdk 23
        consumerProguardFiles "consumer-rules.pro"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    publishing {
        singleVariant('release') { withSourcesJar() }
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlin:kotlin-test:2.1.20'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'androidx.test:core:1.6.1'
}
