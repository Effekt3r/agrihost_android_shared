plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

group = 'za.co.mjrsolutions.shared'
version = '1.0.0'

android {
    namespace 'za.co.mjrsolutions.shared.files'
    compileSdk 36
    defaultConfig {
        minSdk 23
        consumerProguardFiles "consumer-rules.pro"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    publishing {
        singleVariant('release') { withSourcesJar() }
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    // Pin explicit versions — BOM platform constraints don't cross composite-build boundaries
    implementation project(':audit')
    implementation 'com.google.firebase:firebase-storage:21.0.1'
    implementation 'com.google.firebase:firebase-firestore-ktx:25.1.1'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'androidx.core:core-ktx:1.13.1'
    compileOnly 'com.google.firebase:firebase-crashlytics:19.0.3'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlin:kotlin-test:2.1.20'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'com.google.firebase:firebase-crashlytics:19.0.3'
    // The apps' PDF library (hael, mr and vrugte ship itextpdf-5.1.0.jar): PdfHash is checked on its real output.
    testImplementation 'com.itextpdf:itextpdf:5.1.0'
}
