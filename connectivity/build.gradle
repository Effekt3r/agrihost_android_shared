plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

group = 'za.co.mjrsolutions.shared'
version = '1.0.0'

android {
    namespace 'za.co.mjrsolutions.shared.connectivity'
    compileSdk 36
    defaultConfig {
        minSdk 23
        consumerProguardFiles "consumer-rules.pro"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    publishing {
        singleVariant('release') { withSourcesJar() }
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    implementation project(':language')
    // Pin explicit versions — BOM platform constraints don't cross composite-build boundaries
    implementation 'com.google.firebase:firebase-crashlytics-ktx:19.0.3'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlin:kotlin-test:2.1.20'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.mockito:mockito-core:5.7.0'
}
